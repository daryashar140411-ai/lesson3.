<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Отследить посылку — Dostaffkin</title>
<link rel="stylesheet" href="styles/base.css"><link rel="stylesheet" href="styles/base_adaptive.css"><link rel="stylesheet" href="styles/track.css"><link rel="stylesheet" href="styles/track_adaptive.css"></head>
<body class="tracking-page">
<header class="header"><a class="header-brand" href="index.html"><span class="header-logo">D</span><span class="header-title">Dostaffkin</span></a><nav class="header-menu"><a class="header-link" href="order.html">Оформить доставку</a><a class="header-link" href="track.html">Отследить посылку</a></nav></header>
<main class="tracking-main">
<section class="tracking-card search-card"><h1>Отследить посылку</h1><div class="search-body"><input id="number" value="10211833519" aria-label="Номер посылки"><button id="track" type="button">Отследить</button></div></section>
<section class="tracking-card result-card" id="result" hidden>
<div class="result-top"><h2>№10211833519</h2><div class="route-line"><span class="marker orange">⌖</span>Откуда: Москва, улица Арбат, 1</div><div class="down-arrow">↓</div><div class="route-line"><span class="marker green">⌖</span>Куда: Минск, проспект Независимости, 58</div></div>
<div class="status-area"><b>Статус данной посылки:</b>
<div class="status-row"><span class="status-icon yellow">▤</span><span>Создан</span><time>10.01.2026</time></div>
<div class="status-row"><span class="status-icon orange">♧</span><span>В пути</span><time>18.01.2026</time></div>
<div class="status-row"><span class="status-icon brown">⌂</span><span>Готов к выдаче</span><time>25.01.2026</time></div>
<div class="status-row"><span class="status-icon green">✓</span><span>Вручен</span><time>27.01.2026</time></div>
</div></section></main>
<script>
document.getElementById('track').addEventListener('click',function(){
 const number=document.getElementById('number').value.trim();
 document.getElementById('result').hidden = number !== '10211833519';
 if(number !== '10211833519') alert('Посылка с таким номером не найдена. Попробуйте 10211833519.');
});
</script></body></html>
