<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Dostaffkin — доставка посылок между странами и внутри стран. Безопасно, быстро и в целости.">
    <title>Dostaffkin — доставка посылок</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/base_adaptive.css">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/index_adaptive.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <a class="header-brand" href="#" aria-label="Dostaffkin — главная">
                <span class="header-logo">D</span>
                <span class="header-title">Dostaffkin</span>
            </a>
            <nav class="header-menu" aria-label="Основная навигация">
                <a class="header-link" href="order.html">Оформить <span>доставку</span></a>
                <a class="header-link" href="track.html">Отследить <span>посылку</span></a>
            </nav>
        </header>

        <main class="main">
            <section class="main-info">
                <h1 class="main-title"><span>D</span>ostaffkin</h1>

                <div class="main-features" aria-label="Преимущества">
                    <div class="main-feature">Отслеживание 24/7</div>
                    <div class="main-feature">Лучшие маршруты</div>
                    <div class="main-feature">Страхование посылок</div>
                    <div class="main-feature">Доставка в срок</div>
                    <div class="main-feature">Выгодные тарифы</div>
                </div>

                <p class="main-description">
                    Доставка посылок между странами и внутри стран.<br>
                    Безопасно. Быстро. В целости и сохранности!
                </p>

                <div class="main-actions">
                    <a class="button" id="order" href="order.html">Заказать доставку</a>
                    <a class="button button-white" id="track" href="track.html">Отследить посылку</a>
                </div>
            </section>

            <section class="main-image" aria-label="Доставка посылок">
                <img src="images/main-image.png" alt="Курьер, автомобиль и посылки Dostaffkin">
            </section>

            <div class="main-title-ghost" aria-hidden="true">Dostaffkin</div>
        </main>
    </div>
</body>
</html>
